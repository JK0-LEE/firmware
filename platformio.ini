[env:seeed-xiao-esp32-c5]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c5
framework = arduino
; PARLIO cannot allocate its transaction queue on this setup; use RMT.
build_flags = -DFASTLED_ESP32_HAS_PARLIO=0
lib_deps =
	fastled/FastLED@3.10.8
	bblanchon/ArduinoJson@7.4.2
	adafruit/Adafruit SSD1306@2.5.15
extra_scripts = pre:pio_ranlib_with_ar.py
monitor_speed = 115200
